name: release

# Chaque push sur main : compile contre Spigot 1.8.8 ET Paper 1.21.11, puis publie la release v<major.minor>.<build>
# (marquée « latest ») avec NightCache.jar, NightCache.jar.sha256 et version.txt. Les plugins téléchargent
# https://github.com/NightProjectS/NightCache/releases/latest/download/<fichier> au chargement.
on:
  push:
    branches: [main]
    # Un commit qui ne touche que la documentation ne publie pas de release.
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  compat:
    name: compile + tests Paper 1.21.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -Pmc-latest test

  release:
    name: build Spigot 1.8.8 + release
    needs: compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Version
        run: |
          BASE=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)
          BASE=${BASE%-SNAPSHOT}
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1-2)
          V="$MAJOR_MINOR.${{ github.run_number }}"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version publiée : $V"

      - name: Dernière release (référence de compatibilité binaire)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/baseline
          if gh release download --pattern NightCache.jar -D target/baseline; then
            echo "JAPICMP=-Djapicmp.skip=false" >> "$GITHUB_ENV"
          else
            echo "::warning::aucune release publiée : contrôle japicmp sauté"
          fi

      # Tests (SQLite 3.7.2 puis 3.45) et japicmp : échec sur toute suppression ou modification incompatible.
      - name: Build
        run: mvn -B -Drevision="$VERSION" $JAPICMP verify

      - name: Vérifier le jar
        run: |
          JAR=target/NightCache.jar
          unzip -l "$JAR" | grep -q 'weeno/nightcache/NightCache.class'
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q "Implementation-Version: $VERSION"
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'NightCache-Api: '
          if unzip -l "$JAR" | grep -q 'com/github/benmanes'; then echo "::error::Caffeine non relocalisé"; exit 1; fi

      - name: Assets
        run: |
          mkdir -p dist
          cp target/NightCache.jar dist/NightCache.jar
          (cd dist && sha256sum NightCache.jar | cut -d' ' -f1 > NightCache.jar.sha256)
          echo "$VERSION" > dist/version.txt
          cat dist/NightCache.jar.sha256 dist/version.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "release v$VERSION déjà publiée"; exit 0; fi
          gh release create "v$VERSION" dist/NightCache.jar dist/NightCache.jar.sha256 dist/version.txt \
            --target "$GITHUB_SHA" --title "NightCache $VERSION" --latest \
            --notes "Build ${{ github.run_number }} de ${GITHUB_SHA::7}. Les plugins le téléchargent automatiquement au prochain démarrage."
